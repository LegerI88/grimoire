<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Grimoire des Étoiles – Hall du Livre – CAP EPC 1EPC3 – LEGER Isabelle</title>
<meta name="author" content="LEGER Isabelle – Enseignante en Économie-Gestion">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b1030; --night2:#18205a; --gold:#f5c451; --gold2:#ffe08f; --parch:#fffaf0; --parch2:#f6ecd6;
  --ink:#2a2340; --muted:#6b6385; --p1:#14a398; --p2:#8b5cf6; --p3:#ef6f6c; --ok:#1f9d55; --ko:#d64545;
  --r:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --title:'Cinzel Decorative', Georgia, 'Times New Roman', serif;
  --body:'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background:radial-gradient(ellipse at top,#26307a 0%,var(--night) 55%,#05071a 100%);min-height:100vh;font-size:17px;line-height:1.5}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
button{font-family:inherit;cursor:pointer}
a{color:#5b3fd1}
/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(9,13,40,.82);backdrop-filter:blur(8px);border-bottom:1px solid rgba(245,196,81,.35);color:#fff}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{font-family:var(--title);color:var(--gold);font-size:19px;letter-spacing:.5px;white-space:nowrap}
.constel{display:flex;gap:3px;align-items:center;margin-left:auto}
.constel .g{display:flex;gap:2px;padding:3px 6px;border-radius:20px;background:rgba(255,255,255,.07)}
.constel .s{font-size:18px;color:#3a4280;transition:.4s;line-height:1}
.constel .s.on{color:var(--gold);text-shadow:0 0 10px var(--gold)}
.who{font-size:14px;opacity:.9}
.iconbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:6px 10px;font-size:15px}
nav.tabs{max-width:1180px;margin:0 auto;display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
nav.tabs button{background:transparent;border:1px solid rgba(245,196,81,.35);color:#f3e9cf;padding:7px 13px;border-radius:30px;font-weight:700;font-size:14.5px}
nav.tabs button.act{background:var(--gold);color:var(--night);border-color:var(--gold)}
nav.tabs button.lock{margin-left:auto}
main{max-width:1180px;margin:0 auto;padding:22px 16px 80px}
/* ---------- generic cards ---------- */
.card{background:var(--parch);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px;position:relative}
.card.dark{background:rgba(16,22,64,.85);color:#f3eedf;border:1px solid rgba(245,196,81,.3)}
h1,h2,h3{margin:.2em 0 .5em;line-height:1.2}
h1,h2.t{font-family:var(--title);color:var(--gold)}
h2{font-size:26px} h3{font-size:20px}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:13px;font-weight:800;color:#fff}
.p1bg{background:var(--p1)} .p2bg{background:var(--p2)} .p3bg{background:var(--p3)}
.note{background:#fff3cd;border-left:5px solid var(--gold);padding:10px 14px;border-radius:8px;font-size:15px}
.fict{background:#eef4ff;border-left:5px solid #6d8bff;padding:10px 14px;border-radius:8px;font-size:14.5px}
table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
th,td{border:1px solid #d9cfb4;padding:7px 9px;text-align:left;vertical-align:middle}
th{background:#efe3c4;font-weight:800}
tr:nth-child(even) td{background:#fffdf7}
.tbl-wrap{overflow-x:auto}
.btn{background:linear-gradient(135deg,var(--gold),#e9a93a);color:#2b1a00;border:none;padding:12px 22px;border-radius:40px;font-weight:800;font-size:16.5px;box-shadow:0 6px 18px rgba(245,196,81,.35);transition:transform .15s}
.btn:hover{transform:translateY(-2px) scale(1.02)}
.btn.sec{background:#fff;color:var(--ink);box-shadow:none;border:2px solid #d8cfb8}
.btn.small{padding:7px 14px;font-size:14px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
/* ---------- intro ---------- */
.intro{min-height:88vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#fff;padding:20px}
.book{width:min(560px,92vw);background:linear-gradient(160deg,#5a2b16,#2f1309);border-radius:12px 22px 22px 12px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 6px #7a4320,inset 0 0 0 9px var(--gold);position:relative;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.book h1{font-size:clamp(26px,5vw,40px);margin:4px 0 8px;text-shadow:0 0 18px rgba(245,196,81,.6)}
.book .sub{color:#f8e2b0;font-size:16px;margin-bottom:18px}
.book .owl{font-size:56px;filter:drop-shadow(0 0 14px rgba(255,224,143,.7))}
.book input,.book select{width:100%;padding:12px 14px;border-radius:10px;border:2px solid #c99a3d;background:#fff8e7;font-size:17px;margin:6px 0;font-family:inherit}
.book label{display:block;text-align:left;color:#f8e2b0;font-weight:700;font-size:14px;margin-top:8px}
.opening{animation:openbook 1.1s forwards}
@keyframes openbook{0%{transform:scale(1)}40%{transform:scale(1.06) rotateY(0)}100%{transform:scale(.2) rotateY(80deg);opacity:0}}
/* ---------- map ---------- */
.tower{display:flex;flex-direction:column;gap:18px}
.floor{border-radius:22px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.floor.f1{background:linear-gradient(135deg,#0e6d66,#14a398)}
.floor.f2{background:linear-gradient(135deg,#5b30c9,#8b5cf6)}
.floor.f3{background:linear-gradient(135deg,#c2413f,#ef6f6c)}
.floor h3{margin:0;font-family:var(--title);font-size:21px}
.floor .lvl{font-size:13px;opacity:.9;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:14px}
.door{background:rgba(255,255,255,.95);color:var(--ink);border-radius:16px;padding:14px;border:none;text-align:left;transition:.2s;position:relative}
.door:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 12px 24px rgba(0,0,0,.25)}
.door .ic{font-size:30px}
.door .nm{font-weight:800;font-size:16.5px;margin:4px 0}
.door .st{font-size:14px;color:var(--muted)}
.door .stars{position:absolute;top:10px;right:12px;font-size:18px;color:#d8d2c2;letter-spacing:1px}
.door .stars b{color:#f0b429;font-weight:400}
.door.done{outline:3px solid var(--gold)}
.sparkle-bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.35) 1px,transparent 1.5px);background-size:22px 22px;opacity:.35;pointer-events:none}
.owlbar{display:flex;gap:14px;align-items:center}
.owlbar .o{font-size:46px}
.speech{background:#fff;color:var(--ink);border-radius:18px;padding:12px 16px;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.speech::before{content:"";position:absolute;left:-10px;top:20px;border:10px solid transparent;border-right-color:#fff;border-left:0}
/* ---------- mission ---------- */
.mhead{border-radius:var(--r);padding:20px 24px;color:#fff;margin-bottom:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.mhead.p1{background:linear-gradient(135deg,#0e6d66,#14a398)}
.mhead.p2{background:linear-gradient(135deg,#5b30c9,#8b5cf6)}
.mhead.p3{background:linear-gradient(135deg,#c2413f,#ef6f6c)}
.mhead h2{font-family:var(--title);margin:6px 0;font-size:25px}
.comp{background:rgba(255,255,255,.18);border-radius:10px;padding:6px 12px;display:inline-block;font-size:14.5px;margin-top:6px}
.tutor{display:flex;gap:14px;align-items:flex-start}
.tutor .av{font-size:44px;line-height:1}
.tutor .speech{flex:1}
.tutor .name{font-weight:800;font-size:14px;color:var(--muted)}
details.res{background:#fffdf6;border:2px dashed #d6c79c;border-radius:14px;padding:6px 16px;margin:16px 0}
details.res>summary{font-weight:800;font-size:18px;cursor:pointer;padding:8px 0;list-style:none}
details.res>summary::before{content:"📜 "}
.doc{background:#fff;border:1px solid #e3d8bb;border-radius:12px;padding:12px 16px;margin:12px 0;box-shadow:0 3px 8px rgba(0,0,0,.05)}
.doc h4{margin:0 0 6px;font-size:16px;color:#6b3e14}
.sect{margin-top:8px}
.sect>h3{display:flex;align-items:center;gap:8px}
.w{background:#fff;border-radius:14px;padding:14px 16px;margin:14px 0;border:2px solid #efe6cf;position:relative;transition:border-color .3s}
.w .q{font-weight:800;margin-bottom:8px}
.w.ok{border-color:var(--ok);background:#f2fbf5}
.w.ko{border-color:var(--ko);background:#fff5f5}
.w.part{border-color:#e6a23c;background:#fffaf0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid #e8dfc8;border-radius:12px;padding:9px 12px;cursor:pointer;background:#fffdf8;transition:.15s}
.opt:hover{border-color:var(--gold)}
.opt input{margin-top:4px;transform:scale(1.25)}
.opt.sel{border-color:#c9a13b;background:#fff6dc}
.opt.good{border-color:var(--ok)!important;background:#e9f8ef!important}
.opt.bad{border-color:var(--ko)!important;background:#fdecec!important}
.chat .opt{border-radius:18px 18px 18px 4px}
.scene{background:#f1ecff;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-style:italic}
input.in,textarea.in,select.in{font-family:inherit;font-size:16px;padding:8px 10px;border:2px solid #d8cdb0;border-radius:10px;background:#fffef9;color:var(--ink)}
input.in:focus,textarea.in:focus,select.in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,196,81,.3)}
input.num{width:120px;text-align:right}
td input.in{width:100%;min-width:80px}
textarea.in{width:100%;min-height:80px;resize:vertical}
input.in.ok,select.in.ok{border-color:var(--ok);background:#ecf9f1}
input.in.ko,select.in.ko{border-color:var(--ko);background:#fdeeee}
.mk{font-weight:800;margin-left:6px}
.mk.ok{color:var(--ok)} .mk.ko{color:var(--ko)}
.corr{display:inline-block;background:#e7f7ec;color:#126b3a;border:1px dashed #52b47a;border-radius:8px;padding:1px 8px;font-size:13.5px;font-weight:800;margin-left:6px}
.hint{margin-top:8px}
.hint summary{cursor:pointer;color:#7c5a0b;font-weight:700;font-size:14.5px}
.hint div{background:#fff7dd;border-radius:10px;padding:8px 12px;margin-top:6px;font-size:15px}
.order li{list-style:none;display:flex;align-items:center;gap:8px;background:#fffdf8;border:2px solid #e8dfc8;border-radius:12px;padding:8px 10px;margin:6px 0}
.order ol{padding:0;margin:0}
.order .n{background:var(--gold);color:#2b1a00;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.order .tx{flex:1}
.order button{border:1px solid #d8cdb0;background:#fff;border-radius:8px;padding:4px 9px;font-size:15px}
.order li.ok{border-color:var(--ok);background:#ecf9f1}
.order li.ko{border-color:var(--ko);background:#fdeeee}
/* reserve grid */
.gridw{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.gitems{flex:1;min-width:240px}
.gitem{display:flex;justify-content:space-between;gap:8px;align-items:center;border:2px solid #e8dfc8;border-radius:12px;padding:9px 12px;margin:6px 0;cursor:pointer;background:#fffdf8}
.gitem.active{border-color:var(--p1);box-shadow:0 0 0 3px rgba(20,163,152,.25)}
.gitem .loc{font-weight:800;background:#e8f6f4;border-radius:8px;padding:2px 9px;color:#0e6d66}
.gitem.ok{border-color:var(--ok)} .gitem.ko{border-color:var(--ko)}
.reserve{display:grid;grid-template-columns:44px repeat(3,96px);gap:6px;background:#3b2a1a;padding:10px;border-radius:14px;color:#fff}
.reserve .h{text-align:center;font-weight:800;font-size:14px;color:var(--gold2)}
.reserve .lv{display:flex;align-items:center;justify-content:center;font-size:13px;color:#e8d7b5}
.reserve .cell{height:58px;border-radius:8px;background:repeating-linear-gradient(90deg,#8a5a2b 0 9px,#a8743d 9px 11px,#6b3e1a 11px 20px);border:2px solid #5a3a1a;cursor:pointer;position:relative;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:flex-end;justify-content:center;transition:.15s}
.reserve .cell:hover{transform:scale(1.05);border-color:var(--gold)}
.reserve .cell span{background:rgba(0,0,0,.55);border-radius:6px;padding:0 5px;margin-bottom:3px}
.reserve .cell.picked{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold)}
/* cash */
.cashbox{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.bill{width:92px;height:50px;border-radius:7px;border:2px solid rgba(0,0,0,.25);font-weight:800;font-size:17px;color:#1c1c1c;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.2)}
.b20{background:linear-gradient(135deg,#b8d4f5,#6f9fd8)} .b10{background:linear-gradient(135deg,#f7c4b4,#e48b72)} .b5{background:linear-gradient(135deg,#d9d9d9,#a9a9a9)}
.coin{width:52px;height:52px;border-radius:50%;border:3px solid rgba(0,0,0,.2);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.cg{background:radial-gradient(circle at 35% 30%,#fff3b0,#d4a72c)} .cb{background:radial-gradient(circle at 35% 30%,#ffd0a8,#b8652c)} .cbi{background:radial-gradient(circle,#e9e9e9 45%,#d4a72c 46%)}
.tray{min-height:70px;border:3px dashed #c9b88e;border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;background:#fbf6e8}
.tray>*{transform:scale(.85);cursor:pointer}
/* label & card annex */
.label{border:3px dashed #555;border-radius:12px;padding:16px;background:#fff;max-width:560px;font-family:'Courier New',monospace}
.label .lt{font-weight:800;font-size:18px;letter-spacing:2px;border-bottom:2px solid #333;margin-bottom:10px}
.label .fl{display:grid;grid-template-columns:180px 1fr;gap:8px;align-items:center;margin:6px 0}
.plv{width:280px;min-height:330px;border-radius:16px;padding:18px;background:linear-gradient(160deg,#1d2366,#3b1f73);color:#fff;box-shadow:0 0 0 4px var(--gold),0 14px 30px rgba(0,0,0,.35);position:relative;overflow:hidden}
.plv .cc{font-family:var(--title);color:var(--gold);font-size:20px}
.plv .tt{font-weight:800;font-size:19px;margin:10px 0 4px}
.plv .ag{display:inline-block;background:var(--gold);color:#2b1a00;border-radius:20px;padding:1px 10px;font-weight:800;font-size:13px}
.plv .av{margin-top:10px;font-style:italic;white-space:pre-wrap}
.plv .pr{position:absolute;bottom:14px;right:16px;font-size:26px;font-weight:800;color:var(--gold2)}
.plv .sg{position:absolute;bottom:18px;left:16px;font-size:13px;opacity:.85}
.free label{font-weight:800;display:block;margin-bottom:4px}
.free input.in{width:100%}
/* validate */
.valid{text-align:center;padding:24px}
.result{display:flex;align-items:center;gap:20px;justify-content:center;flex-wrap:wrap}
.ring{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;background:conic-gradient(var(--gold) calc(var(--p)*1%),#e9e1cc 0);position:relative}
.ring::after{content:"";position:absolute;inset:12px;background:var(--parch);border-radius:50%}
.ring span{position:relative;z-index:1}
.bigstars{font-size:40px;color:#ddd3bb;letter-spacing:4px}
.bigstars b{color:#f0b429;text-shadow:0 0 14px rgba(240,180,41,.7);font-weight:400}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(5,7,26,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--parch);border-radius:20px;max-width:540px;width:100%;padding:24px;box-shadow:var(--shadow);text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a2160;color:#fff;border:1px solid var(--gold);padding:12px 20px;border-radius:30px;z-index:60;box-shadow:var(--shadow);animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translate(-50%,20px)}}
.burst{position:fixed;z-index:70;pointer-events:none;color:var(--gold);font-size:22px;animation:fly 1.5s ease-out forwards;text-shadow:0 0 10px var(--gold)}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.4);opacity:0}}
/* bilan & teacher */
.code{font-family:'Courier New',monospace;font-size:clamp(24px,5vw,38px);font-weight:800;letter-spacing:3px;background:#1a2160;color:var(--gold2);padding:14px 22px;border-radius:14px;display:inline-block;border:2px solid var(--gold);user-select:all}
.bar{height:16px;background:#ece4cf;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px}
.lv1{background:#e05d5d}.lv2{background:#f0a03c}.lv3{background:#7cc36a}.lv4{background:#1f9d55}
.ae{display:flex;gap:6px;flex-wrap:wrap}
.ae button{border:2px solid #e3d8bb;background:#fff;border-radius:12px;padding:6px 10px;font-size:14px}
.ae button.on{border-color:var(--gold);background:#fff2c8;font-weight:800}
.kpi{display:flex;gap:12px;flex-wrap:wrap}
.kpi div{flex:1;min-width:140px;background:#fff;border-radius:14px;padding:12px;text-align:center;border:2px solid #efe6cf}
.kpi b{display:block;font-size:28px}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:800}
.quiz .opt{font-size:15px}
.src{font-size:14px}
.src li{margin:5px 0}
sup{font-size:11px;color:#6d5bd0;font-weight:800}
#printArea{display:none}
@media print{
  body{background:#fff!important;font-size:12px}
  #sky,#app,.toast,.modal{display:none!important}
  #printArea{display:block!important;color:#000}
  #printArea h1{color:#000;font-family:Georgia,serif}
  #printArea .pm{page-break-inside:avoid;border:1px solid #999;border-radius:8px;padding:8px 12px;margin:8px 0}
  .diploma{page-break-after:always}
}
.diploma{border:10px double #b8892c;border-radius:20px;padding:40px;text-align:center;background:#fffaf0;font-family:Georgia,serif;color:#2a2340}
.diploma h1{font-family:var(--title);color:#9a6b12;font-size:34px}
@media (max-width:640px){
  h2{font-size:22px}
  .reserve{grid-template-columns:34px repeat(3,1fr)}
  .label .fl{grid-template-columns:1fr}
  .constel{margin-left:0}
}
/* ===== animations v2 ===== */
.brand{background:linear-gradient(90deg,#f5c451 0%,#fff6d6 25%,#f5c451 50%,#ffe08f 75%,#f5c451 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% center}}
.anim-in{animation:fadeUp .6s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px) scale(.97)}}
.wd{display:inline-block;animation:wd .45s both}
@keyframes wd{from{opacity:0;transform:translateY(6px);filter:blur(3px)}}
.bob{display:inline-block;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
.glowt{animation:glowt 3s ease-in-out infinite}
@keyframes glowt{50%{text-shadow:0 0 30px rgba(255,224,143,.95),0 0 60px rgba(245,196,81,.5)}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:sweep 4s ease-in-out infinite;pointer-events:none}
.btn.sec::after{display:none}
@keyframes sweep{0%,60%{left:-70%}100%{left:130%}}
.btn.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,196,81,.7)}60%{box-shadow:0 0 0 16px rgba(245,196,81,0)}}
.floor{background-size:200% 200%!important;animation:shift 9s ease-in-out infinite alternate}
@keyframes shift{to{background-position:100% 100%}}
.floor.lit{box-shadow:0 0 0 3px var(--gold),0 0 40px rgba(245,196,81,.55)}

{id:'m4',pole:2,n:4,ic:'📚',title:'Le meuble de Saint-Nicolas',
 comp:['Approvisionner, mettre en rayon et ranger selon la nature des produits'],
 story:`Les cartons sont rangés : place à la magie du rayon ✨ ! Le meuble « Spécial Saint-Nicolas » doit être prêt pour samedi. Un rayon bien rempli et bien organisé, c'est un rayon qui donne envie… et qui vend !`,
 res:`<div class="doc"><h4>🪜 Les 4 niveaux de présentation</h4><div class="tbl-wrap"><table>
  <tr><th>Niveau</th><th>Ce qu'on y place</th></tr>
  <tr><td>Niveau haut (au-dessus des yeux)</td><td>Produits peu demandés, réserve de rayon : peu visibles</td></tr>
  <tr><td>Niveau des yeux</td><td>Le plus visible : nouveautés, coups de cœur, produits à mettre en avant</td></tr>
  <tr><td>Niveau des mains</td><td>Facile à attraper : produits courants très demandés</td></tr>
  <tr><td>Niveau bas (près du sol)</td><td>Produits lourds ou encombrants</td></tr></table></div></div>
  <div class="doc"><h4>✅ Bien approvisionner</h4><ul>
  <li>On fait le <b>réassort avant la rupture</b> : dès que le rayon se vide, on le complète.</li>
  <li>Une nouveauté se présente <b>de face</b> (couverture visible) ; les autres livres peuvent être <b>de dos</b> (on voit la tranche).</li>
  <li>Un produit abîmé est <b>retiré du rayon</b> et signalé.</li>
  <li><b>Linéaire développé</b> = longueur du meuble au sol × nombre de tablettes.</li></ul></div>`,

{id:'m5',pole:2,n:5,ic:'🏷️',title:'Les étiquettes qui brillent',
 comp:['Mettre en valeur les produits et l\'espace commercial','Installer et mettre à jour la signalétique'],
 story:`Samedi, la librairie va être pleine de familles 🎄. Les prix doivent être justes, les panneaux bien placés… et nos coups de cœur doivent briller ! Mais attention : en France, le prix d'un livre obéit à une loi bien particulière…`,
 res:`<div class="doc"><h4>⚖️ Le prix du livre en France</h4><ul>
  <li>La <b>loi Lang</b> (loi n° 81-766 du 10 août 1981) instaure le <b>prix unique du livre</b> : c'est l'<b>éditeur</b> qui fixe le prix de vente au public.<sup>[8][9]</sup></li>
  <li>Le libraire peut accorder au client un <b>rabais de 5 % maximum</b> sur ce prix.<sup>[8][9]</sup></li>
  <li>La TVA sur les livres est au <b>taux réduit de 5,5 %</b> (article 278-0 bis du Code général des impôts).<sup>[8]</sup></li></ul>
  <p><b>Formules :</b> Prix HT = Prix TTC ÷ 1,055 · TVA = Prix TTC − Prix HT · Prix minimum autorisé = Prix TTC × 0,95</p></div>
  <div class="doc"><h4>🪧 La signalétique</h4><p>Elle guide le client : panneaux d'univers (Albums, Romans, Manga…), étiquettes prix, et <b>PLV</b> (publicité sur le lieu de vente) comme l'étiquette « Coup de cœur du libraire ».</p></div>`,
 acts:[
  {type:'num',k:'p1',q:'L\'« Atlas des créatures fantastiques » coûte 19,90 € TTC. Quel est son prix HT ?',ans:18.86,tol:0.006,unit:'€',hint:'19,90 ÷ 1,055 = 18,8625… arrondi au centime.'},
  {type:'num',k:'p2',q:'Quel est le montant de la TVA ?',ans:1.04,tol:0.006,unit:'€'},
  {type:'num',k:'p3',q:'Quel est le prix le plus bas auquel la librairie peut le vendre (rabais maximum) ?',ans:18.905,tol:0.006,unit:'€',show:'18,90 ou 18,91'},
  {type:'sel',k:'lg',q:'Vrai ou faux ?',choices:['Vrai','Faux'],
   rows:[{l:'La librairie peut vendre le coffret « L\'Académie des sorciers », paru le mois dernier à 29,90 €, au prix de 19,90 € pour une promotion.',ans:1},
         {l:'Le prix d\'un livre neuf est fixé par l\'éditeur.',ans:0},
         {l:'Le client doit pouvoir connaître le prix de chaque livre exposé.',ans:0}]},
  {type:'sel',k:'sg',q:'Sous quel panneau d\'univers ranges-tu ces livres ?',
   choices:['Albums 3-6 ans','Romans 9-12 ans','Documentaires jeunesse','Manga','BD'],
   rows:[{l:'Kitsune Blade – Tome 3',ans:3},{l:'Atlas des créatures fantastiques',ans:2},{l:'Saint-Nicolas et l\'âne gourmand',ans:0}]},
  {type:'qcm',k:'pl',q:'Une étiquette « Coup de cœur du libraire » sert à :',
   opts:['Cacher le prix','Attirer l\'attention et donner envie en partageant un avis','Remplacer le code-barres'],ans:1}
 ],

{id:'m6',pole:2,n:6,ic:'🔍',title:'L\'énigme des mangas disparus',
 comp:['Participer aux opérations de conditionnement des produits','Lutter contre la démarque et participer aux opérations d\'inventaire'],
 story:`Oups 😬 ! Le logiciel indique 47 « Kitsune Blade – Tome 3 » en stock… mais au rayon, on n'en trouve pas autant ! Je te confie le comptage du rayon Manga. Et comme les clients demandent beaucoup de paquets-cadeaux, tu vas aussi devenir pro de l'emballage 🎁.`,
 res:`<div class="doc"><h4>🕵️ La démarque</h4>
  <p>La démarque est l'écart entre le <b>stock théorique</b> (ce que dit le logiciel) et le <b>stock réel</b> (ce que l'on compte).</p>
  <ul><li><b>Démarque connue</b> : on connaît la cause et on l'a enregistrée (produit abîmé, casse…).</li>
  <li><b>Démarque inconnue</b> : on ne connaît pas la cause (vol non détecté, erreur jamais repérée…).</li>
  <li>Pour lutter : vigilance en rayon, antivols, contrôle sérieux à la réception.</li></ul></div>
  <div class="doc"><h4>🧮 L'inventaire</h4><p>On compte physiquement chaque produit. <b>Écart = stock réel − stock théorique</b> (négatif s'il manque des produits). <b>Valeur de l'écart</b> = nombre d'exemplaires manquants × prix d'achat HT.</p></div>
  <div class="doc"><h4>🎁 Le paquet-cadeau : les bons réflexes</h4><p>On propose toujours le service au client. On choisit un papier adapté à l'occasion et à la taille du livre, on le coupe à la bonne dimension, on emballe proprement, on décore, et on remet le paquet avec un ticket cadeau.</p></div>`,
 acts:[
  {type:'sel',k:'dm',q:'Démarque connue ou inconnue ?',choices:['Démarque connue','Démarque inconnue'],
   rows:[{l:'3 « Kitsune Blade » abîmés, retirés du rayon et enregistrés',ans:0},
         {l:'Un livre volé sans que personne ne s\'en aperçoive',ans:1},
         {l:'Un album tombé dans une flaque, enregistré en casse',ans:0},
         {l:'Une erreur de comptage à la réception, jamais repérée',ans:1}]},
  {type:'order',k:'pq',pts:2,q:'Remets dans l\'ordre les étapes du paquet-cadeau :',
   items:['Demander au client s\'il souhaite un paquet-cadeau','Choisir un papier adapté (occasion, taille du livre)','Couper le papier à la bonne dimension','Emballer le livre et fixer avec du ruban adhésif','Ajouter le ruban ou l\'étiquette décorative','Remettre le paquet au client avec le ticket cadeau'],
   start:[4,2,0,5,3,1]}
 ],

{id:'m7',pole:3,n:7,ic:'🌟',title:'Le sortilège de l\'accueil',
 comp:['Préparer son environnement de travail','Prendre contact avec le client'],
 story:`La librairie ouvre dans 5 minutes ⏰ et aujourd'hui, tu es au comptoir d'accueil et de caisse. Un bon accueil, c'est la première magie du commerce : en quelques secondes, le client décide s'il se sent bien chez nous.`,
 res:`<div class="doc"><h4>🧰 Mon poste de travail</h4><ul>
  <li>Tenue propre et adaptée, badge visible.</li>
  <li>Fond de caisse compté, terminal de paiement (TPE) et imprimante à tickets qui fonctionnent.</li>
  <li>Sacs, papier cadeau, ruban adhésif à portée de main. Poste rangé.</li>
  <li>Téléphone personnel rangé : pendant le travail, je suis disponible pour les clients.</li></ul></div>
  <div class="doc"><h4>4️⃣ La règle des 4 × 20</h4><p>Les <b>20 premières secondes</b>, les <b>20 premiers mots</b>, les <b>20 premiers gestes</b> et les <b>20 cm du visage</b> (sourire, regard) construisent la première impression du client.</p></div>
  <div class="doc"><h4>😊 S.B.A.M.</h4><p><b>S</b>ourire · <b>B</b>onjour · <b>A</b>u revoir · <b>M</b>erci. On vouvoie le client, on se tient face à lui, à environ un mètre.</p></div>`,
 acts:[
  {type:'multi',k:'chk',pts:3,q:'Avant l\'ouverture, que dois-tu vérifier ? (plusieurs réponses possibles)',
   opts:['Le fond de caisse est compté','Mon téléphone personnel est posé à côté de la caisse pour répondre vite','Le TPE et l\'imprimante à tickets fonctionnent','Mes écouteurs sont prêts pour écouter de la musique','Les sacs et le papier cadeau sont prêts'],
   ans:[true,false,true,false,true]},
  {type:'qcm',k:'d1',chat:true,scene:'🧑 Un client entre et regarde partout autour de lui. Tu dis :',
   opts:['« Vous voulez quoi ? »','« Bonjour ! Bienvenue au Hall du Livre. Je vous laisse découvrir, n\'hésitez pas si vous avez besoin de moi. »','(Rien : tu continues ton rangement sans lever la tête.)'],ans:1},
  {type:'qcm',k:'d2',chat:true,scene:'📞 Tu es au téléphone avec un fournisseur. Une cliente arrive au comptoir. Tu :',
   opts:['Lui fais un signe de tête et un sourire pour montrer que tu l\'as vue, puis tu abrèges poliment l\'appel','Lui tournes le dos pour mieux entendre','Raccroches au nez du fournisseur'],ans:0},
  {type:'qcm',k:'d3',chat:true,scene:'🧑‍🦱 « Vous avez le dernier Kitsune Blade ? »',

{id:'m8',pole:3,n:8,ic:'🐉',title:'Le cadeau parfait pour Tom',
 comp:['Accompagner le parcours client dans un contexte omnicanal','Conseiller le client'],
 story:`Une cliente s'approche avec un grand sourire : « Bonjour ! Je cherche un cadeau de Saint-Nicolas pour mon neveu… » C'est ton moment : écoute, questionne, conseille ! 🎯`,
 res:`<div class="doc"><h4>👩 La cliente : Mme Nadia Lambert (cliente fictive)</h4>
  <p class="scene">« C'est pour mon neveu Tom, il a 9 ans. Il adore les dragons et les créatures magiques. Il lit déjà tout seul. Je ne veux pas dépasser 20 €. »</p></div>
  <div class="doc"><h4>📗 Extrait du catalogue (titres fictifs)</h4><div class="tbl-wrap"><table>
  <tr><th>Titre</th><th>Genre</th><th>Âge conseillé</th><th>Thème</th><th>Prix TTC</th><th>Stock</th></tr>
  <tr><td>Le Dragon de la place Stanislas</td><td>Album</td><td>4-7 ans</td><td>Dragons, Nancy</td><td>14,90 €</td><td>32</td></tr>
  <tr><td>Atlas des créatures fantastiques</td><td>Documentaire illustré</td><td>8-12 ans</td><td>Dragons, licornes, créatures magiques</td><td>19,90 €</td><td>15</td></tr>
  <tr><td>L'Académie des sorciers – Coffret T1 à T3</td><td>Roman</td><td>10 ans et +</td><td>Magie, école</td><td>29,90 €</td><td>6</td></tr>
  <tr><td>Kitsune Blade – Tome 3</td><td>Manga</td><td>12 ans et +</td><td>Combats, Japon</td><td>7,20 €</td><td>44</td></tr>
  <tr><td>Les Mystères de la Pépinière</td><td>Roman</td><td>9-12 ans</td><td>Enquête dans un parc</td><td>12,50 €</td><td>9</td></tr></table></div></div>
  <div class="doc"><h4>❓ Questionner et reformuler</h4><ul>
  <li><b>Question ouverte</b> : le client répond librement (« Qu'est-ce que… ? », « Comment… ? »). Elle le fait parler.</li>
  <li><b>Question fermée</b> : le client répond par oui ou non.</li>
  <li><b>Reformulation</b> : je résume le besoin (« Si je comprends bien… ») pour vérifier que j'ai compris.</li>
  <li><b>Argumenter</b> : je relie une caractéristique du produit à ce que veut le client.</li></ul></div>
  <div class="doc"><h4>🌐 Le parcours omnicanal</h4><ul>
  <li><b>Click & collect</b> : le client commande en ligne et retire en magasin.</li>
  <li><b>Commande client en magasin</b> : le produit n'est pas en stock, le vendeur le commande, le client revient le chercher.</li>
  <li><b>Web-to-store</b> : le client découvre le produit sur Internet (site, réseaux sociaux) puis vient l'acheter en boutique.</li>
  <li><b>Livraison à domicile</b> : le produit est envoyé chez le client.</li></ul></div>`,
 acts:[
  {type:'sel',k:'qt',q:'Quel est le type de chaque phrase du vendeur ?',choices:['Question ouverte','Question fermée','Reformulation'],
   rows:[{l:'« Qu\'est-ce qu\'il aime lire en ce moment ? »',ans:0},{l:'« Il lit déjà tout seul ? »',ans:1},
         {l:'« Si je comprends bien, vous cherchez un livre sur les dragons pour un garçon de 9 ans, à 20 € maximum. »',ans:2}]},
  {type:'qcm',k:'pr',pts:2,q:'Quel livre proposes-tu en priorité à Mme Lambert ?',

  {type:'qcm',k:'sv',q:'Pour finaliser, quel service proposes-tu ?',

  {type:'sel',k:'om',q:'Associe chaque situation au bon parcours :',choices:['Click & collect','Commande client en magasin','Web-to-store','Livraison à domicile'],
   rows:[{l:'Le client commande sur Internet et vient chercher son livre en magasin.',ans:0},
         {l:'Le livre n\'est pas en stock : tu le commandes pour le client, qui reviendra le chercher.',ans:1},

{id:'m9',pole:3,n:9,ic:'💰',title:'La caisse et le client fâché',
 comp:['Finaliser la prise en charge du client','Recevoir les réclamations courantes'],
 story:`Mme Lambert est ravie 😍 : elle prend l'Atlas pour Tom… et aussi « Saint-Nicolas et l'âne gourmand » pour sa fille ! Direction la caisse. Mais attention : derrière elle, un client a l'air très fâché…`,
 res:`<div class="doc"><h4>🧾 Le passage en caisse de Mme Lambert</h4><ul>
  <li>Atlas des créatures fantastiques : 19,90 € · Saint-Nicolas et l'âne gourmand : 11,90 € · Paquet-cadeau : offert.</li>
  <li>Elle a la carte de fidélité de la librairie (avantage fictif) : <b>5 % de remise</b> sur les livres (la loi autorise 5 % au maximum).</li>
  <li>Elle paie avec <b>un billet de 50 €</b>.</li></ul></div>
  <div class="doc"><h4>📦 Remettre un colis « retrait en magasin »</h4><p>Je demande le nom et le numéro de commande, je vérifie la <b>pièce d'identité</b>, puis je remets le colis et je fais valider la remise.</p></div>
  <div class="doc"><h4>😠 Le client fâché : M. Karim Benali (client fictif)</h4><p class="scene">« J'ai acheté ce roman samedi : il manque 16 pages au milieu, elles sont blanches ! C'est inadmissible ! »</p>
  <p><b>Les bons réflexes (dans le désordre !)</b> : remercier et prendre congé · écouter calmement · vérifier que la solution convient · reformuler le problème · proposer une solution ou transmettre à sa responsable.</p></div>`,
 acts:[
  {type:'num',k:'t1',q:'Total des 2 livres avant remise :',ans:31.8,tol:0.006,unit:'€'},
  {type:'num',k:'t2',q:'Montant net à payer après la remise de 5 % :',ans:30.21,tol:0.006,unit:'€',hint:'Remise = 31,80 × 5 ÷ 100. Net = total − remise.'},
  {type:'num',k:'t3',q:'Monnaie à rendre sur le billet de 50 € :',ans:19.79,tol:0.006,unit:'€'},
  {type:'cash',k:'cash',pts:2,target:1979,q:'Compose la monnaie à rendre dans le plateau (sans calculatrice !). Clique sur une pièce du plateau pour la retirer.',sample:[1000,500,200,200,50,20,5,2,2]},
  {type:'qcm',k:'cc',q:'M. Petitjean vient chercher sa commande WEB-26-1123. Avant de lui remettre son colis, tu vérifies :',
   opts:['Sa carte de fidélité','Son identité (pièce d\'identité) et le numéro de commande','Rien, il a l\'air honnête'],ans:1},
  {type:'order',k:'rec',pts:2,q:'Remets dans l\'ordre le traitement de la réclamation de M. Benali :',
   items:['Écouter le client calmement, sans l\'interrompre','Reformuler son problème pour montrer que j\'ai compris','Proposer une solution (échange du livre) ou transmettre à ma responsable si je ne peux pas décider','Vérifier que la solution convient au client','Remercier le client et prendre congé chaleureusement'],

function okNum(v,d){const x=pnum(v);if(isNaN(x))return false;const t=(d.tol??0)+1e-9;if(Math.abs(x-d.ans)<=t)return true;return (d.alt||[]).some(z=>Math.abs(x-z)<=t)}
function gradeW(m,d){
  const a=ms(m.id).a; let got=0,max=0; const mk={};
  switch(d.type){
  case 'num': mk[d.k]=okNum(a[d.k],d); max=d.pts||1; got=mk[d.k]?max:0; break;
  case 'qcm': mk[d.k]=String(a[d.k])===String(d.ans); max=d.pts||1; got=mk[d.k]?max:0; break;
  case 'multi': { const v=a[d.k]||[]; let c=0; const any=v.some(Boolean); d.opts.forEach((_,i)=>{const ok=!!v[i]===d.ans[i];mk[d.k+'_'+i]=ok;if(ok)c++}); max=d.pts; got=any?d.pts*c/d.opts.length:0; break;}
  case 'sel': d.rows.forEach((r,i)=>{const kk=d.k+'_'+i;mk[kk]=String(a[kk])===String(r.ans);max+=1;if(mk[kk])got+=1}); break;
  case 'table': d.rows.forEach(r=>r.forEach(c=>{if(c&&c.n){mk[c.n]=okNum(a[c.n],c);max+=c.pts||1;if(mk[c.n])got+=c.pts||1}})); break;
  case 'order': { const touched=!!a[d.k]; const p=a[d.k]||d.start; let c=0; p.forEach((v,i)=>{mk[d.k+'_'+i]=touched&&v===i;if(v===i)c++}); max=d.pts; got=touched?d.pts*c/p.length:0; break;}
  case 'grid': d.items.forEach((it,i)=>{const kk=d.k+'_'+i;mk[kk]=a[kk]===it.ans;max+=1;if(mk[kk])got+=1}); break;
  case 'cash': { const s=(a[d.k]||[]).reduce((x,y)=>x+y,0); mk[d.k]=s===d.target; max=d.pts; got=mk[d.k]?d.pts:0; break;}
  case 'label': d.fields.filter(f=>!f.free).forEach(f=>{const v=norm(a[f.k]);mk[f.k]=f.re.some(r=>r.test(v));max+=1;if(mk[f.k])got+=1}); break;
  }
  return {got,max,mk};
}
function gradeM(m){let got=0,max=0,marks={};allW(m).forEach(d=>{const r=gradeW(m,d);got+=r.got;max+=r.max;Object.assign(marks,r.mk)});return {got,max,marks}}
function emptyCount(m){const a=ms(m.id).a;let n=0;allW(m).forEach(d=>{
  if(d.type==='num'||d.type==='qcm'){if(a[d.k]==null||a[d.k]==='')n++}
  else if(d.type==='sel')d.rows.forEach((_,i)=>{const v=a[d.k+'_'+i];if(v==null||v==='')n++});
  else if(d.type==='table')d.rows.forEach(r=>r.forEach(c=>{if(c&&c.n&&(a[c.n]==null||a[c.n]===''))n++}));
  else if(d.type==='grid')d.items.forEach((_,i)=>{if(!a[d.k+'_'+i])n++});
  else if(d.type==='cash'){if(!(a[d.k]||[]).length)n++}
  else if(d.type==='order'){if(!a[d.k])n++}
  else if(d.type==='multi'){if(!(a[d.k]||[]).some(Boolean))n++}
  else if(d.type==='label')d.fields.filter(f=>!f.free).forEach(f=>{if(!a[f.k])n++});
 });return n}
function fillCorrect(m){const a=ms(m.id).a;allW(m).forEach(d=>{
  if(d.type==='num')a[d.k]=fmtN(Math.round(d.ans*100)/100).replace('−','-');
  if(d.type==='qcm')a[d.k]=String(d.ans);
  if(d.type==='multi')a[d.k]=d.ans.slice();
  if(d.type==='sel')d.rows.forEach((r,i)=>a[d.k+'_'+i]=String(r.ans));
  if(d.type==='table')d.rows.forEach(r=>r.forEach(c=>{if(c&&c.n)a[c.n]=String(c.ans).replace('.',',')}));
  if(d.type==='order')a[d.k]=d.items.map((_,i)=>i);
  if(d.type==='grid')d.items.forEach((it,i)=>a[d.k+'_'+i]=it.ans);
  if(d.type==='cash')a[d.k]=d.sample.slice();
  if(d.type==='label')d.fields.filter(f=>!f.free).forEach(f=>a[f.k]=f.sample);

function tagOf(e){const c=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z]/g,'');
  return ((c(e.prenom)+'XXX').slice(0,3)+(c(e.nom)+'X').slice(0,1))}
function autoPole(p){const v=M.filter(m=>m.pole===p).flatMap(m=>(S.m[m.id]?.ae||[]).filter(x=>x>0));return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0}
function makeCode(){
  const sc=M.map(m=>{const s=S.m[m.id];return s&&s.done?s.pts:11});
  const au=[1,2,3].map(autoPole);
  let N=0; for(let i=8;i>=0;i--) N=N*12+sc[i]; for(let i=2;i>=0;i--) N=N*5+au[i];
  let body=''; for(let i=0;i<8;i++){body=ALPH[N%32]+body;N=Math.floor(N/32)}
  const tag=tagOf(S.eleve), h=fnv(tag+body+SALT)%1024;
  return tag+'-'+body.slice(0,4)+'-'+body.slice(4)+ALPH[h>>5]+ALPH[h&31];
}
function decodeCode(raw){
  const s=String(raw||'').toUpperCase().replace(/\s/g,''); const i=s.indexOf('-'); if(i<1) return null;
  const tag=s.slice(0,i), rest=s.slice(i+1).replace(/-/g,'');
  if(!/^[A-Z]{4}$/.test(tag)||rest.length!==10) return null;
  for(const ch of rest) if(!ALPH.includes(ch)) return null;
  const body=rest.slice(0,8), ck=rest.slice(8), h=fnv(tag+body+SALT)%1024;
  const valid = ck===ALPH[h>>5]+ALPH[h&31];
  let N=0; for(const ch of body) N=N*32+ALPH.indexOf(ch);
  const au=[]; for(let k=0;k<3;k++){au.push(N%5);N=Math.floor(N/5)}
  const sc=[]; for(let k=0;k<9;k++){sc.push(N%12);N=Math.floor(N/12)}
  if(sc.some(x=>x>11)||N!==0) return {tag,valid:false,sc:[],au:[]};
  return {tag,valid,sc,au};
}

   case 'label': return `<ul>${d.fields.map(f=>`<li>${f.l} : <b>${v(f.k)}</b></li>`).join('')}</ul>`;
   case 'free': return `<p>${d.label}<br><b>${v(d.k).replace(/\n/g,'<br>')}</b></p>`;
   case 'card': return `<p>PLV coup de cœur : <b>${v('ct')}</b> · ${v('ca')} · « ${v('cv')} » · ${v('cp')} · ${v('cs')}</p>`;
  }return ''}
function doPrint(withDip){
  const e=S.eleve, done=M.filter(m=>S.m[m.id]?.done);
  let h='';
  if(withDip) h+=diplomaHtml();
  h+=`<h1>Le Grimoire des Étoiles – Dossier de ${esc(e.prenom)} ${esc(e.nom)} (${esc(e.classe)})</h1><p>CAP Équipier polyvalent du commerce · Situation fictive au Hall du Livre (Nancy) · Imprimé le ${new Date().toLocaleDateString('fr-FR')}</p>
   <p><b>Code :</b> ${makeCode()} · <b>Missions accomplies :</b> ${done.length}/9 · Enseignante : ${TEACHER_NAME}</p>`;
  M.forEach(m=>{const s=ms(m.id);h+=`<div class="pm"><h3>Mission ${m.n} – ${m.title} (Pôle ${m.pole}) : ${s.done?(SEE()?s.pts*10+' %':'accomplie'):'non validée'}</h3>${allW(m).filter(d=>d.type!=='html').map(d=>ansText(m,d,s.a)).join('')}<p><b>Autoévaluation :</b></p><ul>${GRILLES[m.id].map((c,i)=>`<li>${c} : <b>${(s.ae||[])[i]?AE_LV[s.ae[i]-1].e+' '+AE_LV[s.ae[i]-1].t:'—'}</b></li>`).join('')}</ul><p>À retravailler : <b>${esc(s.a.ae_txt||'—')}</b></p></div>`});
  $('#printArea').innerHTML=h; setTimeout(()=>window.print(),150);
}
function diplomaHtml(){const e=S.eleve;const done=M.filter(m=>S.m[m.id]?.done);const g=Math.round(done.reduce((a,m)=>a+S.m[m.id].pts*10,0)/Math.max(1,done.length));
  return `<div class="diploma"><div style="font-size:60px">🦉</div><h1>Diplôme du Grimoire des Étoiles</h1><p style="font-size:18px">L'Ordre des Étoiles de Saint-Nicolas certifie que</p><p style="font-size:30px;font-weight:800">${esc(e.prenom)} ${esc(e.nom)}</p><p style="font-size:18px">a allumé les 9 étoiles de l'opération Saint-Nicolas<br>et mérite le titre d'<b>Équipier(ère) Enchanteur(eresse)</b>.</p><p style="font-size:40px;color:#e0a82e">${'★'.repeat(9)}</p><p>Classe ${esc(e.classe)} · CAP Équipier polyvalent du commerce</p><p style="margin-top:24px">L'enseignante : <b>${TEACHER_NAME}</b></p><p style="font-size:12px;color:#777">Diplôme fictif et pédagogique, sans valeur officielle.</p></div>`}

/* ---------------------------------------------------------------------
   ÉVÉNEMENTS
--------------------------------------------------------------------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.m&&t.dataset.k&&t.type!=='radio'&&t.type!=='checkbox'&&t.tagName!=='SELECT'){
    const st=ms(t.dataset.m); if(st.done) return; st.a[t.dataset.k]=t.value; save();
    const pv=document.querySelector(`[data-pv="${t.dataset.k}"]`); if(pv){pv.textContent=t.value||({ca:'âge',cv:'Ton avis apparaîtra ici…'}[t.dataset.k]||'');pv.classList.remove('flash');void pv.offsetWidth;pv.classList.add('flash')} updProg();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.dq!=null){S.decouv[t.dataset.dq]=t.value;save();render();chime('tap');return}
  if(t.dataset.act==='showans'){SHOWANS=t.checked;toast(SHOWANS?'Corrigé affiché dans les missions':'Corrigé masqué');return}
  if(!t.dataset.m) return; const st=ms(t.dataset.m); if(st.done) return;
  if(t.type==='radio'){st.a[t.dataset.k]=t.value;save();t.closest('.opts').querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.contains(t)));chime('tap')}
  else if(t.type==='checkbox'){const arr=st.a[t.dataset.k]||[];arr[+t.dataset.i]=t.checked;st.a[t.dataset.k]=arr;save();t.closest('.opt').classList.toggle('sel',t.checked)}
  else if(t.tagName==='SELECT'){st.a[t.dataset.k]=t.value;save();t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash');chime('tap')}
  updProg();
});
function rerenderW(mid,k){const m=mById(mid);const d=allW(m).find(x=>x.k===k);const el=document.getElementById(`w_${mid}_${k}`);if(el&&d){const tmp=document.createElement('div');tmp.innerHTML=renderW(m,d);el.replaceWith(tmp.firstElementChild)}}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return}
  const o=e.target.closest('[data-open]'); if(o){portal(e.clientX||innerWidth/2,e.clientY||innerHeight/2,o.dataset.pole||mById(o.dataset.open).pole,()=>go('mission',o.dataset.open));return}
  const ge=e.target.closest('[data-ge]'); if(ge){const st=ms(ge.dataset.ge);if(st.done)return;st.ae=st.ae||[];st.ae[+ge.dataset.i]=+ge.dataset.v;S._lastCode=null;save();ge.closest('tr').querySelectorAll('.aeb').forEach(x=>x.classList.toggle('on',x===ge));const r=ge.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,6);chime('tap');updProg();return}
  const b=e.target.closest('[data-act]'); if(!b) return; const act=b.dataset.act;
  const mid=b.dataset.m, k=b.dataset.k;
  if(act==='start'){const p=$('#ip').value.trim(),n=$('#in').value.trim(),c=$('#ic').value.trim()||'1EPC3';
    if(!p||!n){toast('🦉 Écris ton prénom et ton nom pour ouvrir le grimoire !');return}
    const changed=S.eleve&&(S.eleve.prenom!==p||S.eleve.nom!==n)&&Object.keys(S.m).length;
    const doStart=()=>{S.eleve={prenom:p,nom:n,classe:c};save();$('#book').classList.add('opening');document.querySelector('.sparkring')?.classList.add('boom');const r=$('#book').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,50);chime('win');setTimeout(()=>go('map'),1000)};
    if(changed){modal(`<h3>Un autre élève a déjà travaillé ici</h3><p>Le travail de <b>${esc(S.eleve.prenom)} ${esc(S.eleve.nom)}</b> est enregistré sur ce poste. Seule l'enseignante peut l'effacer (espace 🔐). Veux-tu continuer avec ce travail ?</p>`,[{t:'Continuer ce travail',f:()=>go('map')},{t:'Annuler',sec:true}]);return}
    doStart();return}
  if(act==='sound'){S.sound=!S.sound;save();render();chime('tap');return}
  if(act==='up'||act==='dn'){const m=mById(mid),d=allW(m).find(x=>x.k===k),st=ms(mid);const p=st.a[k]||d.start.slice();const i=+b.dataset.p,j=act==='up'?i-1:i+1;[p[i],p[j]]=[p[j],p[i]];st.a[k]=p;save();rerenderW(mid,k);chime('tap');return}
  if(act==='gitem'){GRIDSEL[mid+k]=+b.dataset.i;rerenderW(mid,k);return}
  if(act==='gcell'){const st=ms(mid);if(st.done)return;const i=GRIDSEL[mid+k]??0;st.a[k+'_'+i]=b.dataset.c;const d=allW(mById(mid)).find(x=>x.k===k);const nx=d.items.findIndex((_,j)=>!st.a[k+'_'+j]);GRIDSEL[mid+k]=nx>=0?nx:i;save();rerenderW(mid,k);chime('tap');return}
  if(act==='cadd'){const st=ms(mid);if(st.done)return;(st.a[k]=st.a[k]||[]).push(+b.dataset.c);save();rerenderW(mid,k);chime('tap');return}
  if(act==='crem'){const st=ms(mid);if(st.done)return;st.a[k].splice(+b.dataset.i,1);save();rerenderW(mid,k);return}
  if(act==='cclr'){const st=ms(mid);st.a[k]=[];save();rerenderW(mid,k);return}
  if(act==='validate'){const m=mById(mid);const st0=ms(mid);const g=GRILLES[mid];
    if((st0.ae||[]).filter(Boolean).length<g.length){toast('🦉 Remplis d\'abord ta grille d\'autoévaluation !');const el=$('#aeg');el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');return}
    const n=emptyCount(m);
    modal(`<div style="font-size:46px" class="bob">🦉</div><h3>Sceller la mission ${m.n} ?</h3>${n?`<p class="note">Il reste <b>${n}</b> réponse(s) vide(s).</p>`:'<p>Toutes tes réponses sont remplies. 👍</p>'}<p>Après validation, tu ne pourras plus modifier tes réponses.</p>`,
      [{t:'✨ Oui, je valide',f:()=>{const r=gradeM(m);const st=ms(mid);st.done=true;st.pts=Math.max(0,Math.min(10,Math.round(r.got)));st.marks=r.marks;S._lastCode=null;save();
        ritual(m,()=>{render();const el=document.querySelector('.done-card,.valid');if(el)el.scrollIntoView({block:'center'});updProg()})}},{t:'Je vérifie encore',sec:true}]);return}
  if(act==='gencode'){if(!M.some(m=>S.m[m.id]?.done)){toast('🦉 Valide au moins une mission avant de générer ton code.');return}
    S._lastCode=makeCode();save();$('#codeOut').innerHTML=`<div class="code">${S._lastCode}</div><p class="muted" style="font-size:14px">${M.filter(m=>S.m[m.id]?.done).length}/9 missions incluses · grilles d'autoévaluation incluses</p>`;const r=$('#codeOut').getBoundingClientRect();burst(r.left+r.width/2,r.top+20,30);chime('win');return}
  if(act==='copy'){const c=S._lastCode||makeCode();(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast('📋 Code copié : '+c)).catch(()=>toast('Sélectionne le code et fais Ctrl+C'));return}
  if(act==='print'){doPrint(false);return}
  if(act==='diploma'){modal(diplomaHtml(),[{t:'🖨️ Imprimer',f:()=>doPrint(true)},{t:'Fermer',sec:true}]);burst(innerWidth/2,innerHeight/2,70);chime('win');return}
  if(act==='tlogin'){const v=$('#tcode').value.trim().toUpperCase();if(fnv(v+'|hdl-epc-prof')===T_HASH){TEACH=true;render();animIn();toast('Bienvenue dans l\'espace enseignante')}else{toast('Code incorrect');$('#tcode').value=''}return}
  if(act==='tout'){TEACH=false;SHOWANS=false;go('map');return}
  if(act==='decode'){const v=$('#dcode').value;$('#dout').innerHTML=decodeHtml(decodeCode(v));return}
  if(act==='batch'){batch();return}
  if(act==='csv'){csv();return}
  if(act==='treset'){const id=$('#tm').value;delete S.m[id];S._lastCode=null;save();render();toast('Mission réinitialisée');return}
  if(act==='tfill'){const id=$('#tm').value;const st=ms(id);if(st.done){toast('Réinitialisez d\'abord la mission');return}fillCorrect(mById(id));ms(id).ae=GRILLES[id].map(()=>3);save();go('mission',id);toast('🪄 Corrigé rempli (démo) : il ne reste qu\'à valider');return}
  if(act==='tnew'){modal('<h3>Effacer tout le travail de ce poste ?</h3><p>Cette action est définitive.</p>',[{t:'Oui, effacer',f:()=>{S=fresh();save();TEACH=false;SHOWANS=false;go('intro')}},{t:'Annuler',sec:true}]);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='tcode')document.querySelector('[data-act="tlogin"]').click();if(e.target.id==='dcode')document.querySelector('[data-act="decode"]').click();if(['ip','in','ic'].includes(e.target.id))document.querySelector('[data-act="start"]').click()}});

VIEW = S.eleve ? 'map' : 'intro';
render(); animIn();
// compteurs animés
new MutationObserver(()=>{document.querySelectorAll('.count:not(.done)').forEach(el=>{el.classList.add('done');const to=+el.dataset.to;let i=0;const f=()=>{el.textContent=i;if(i++<to)setTimeout(f,120)};f()})}).observe(document.getElementById('app'),{childList:true,subtree:true});
// traînée d'étoiles derrière la souris
if(!REDUCED){let last=0;addEventListener('pointermove',e=>{const t=performance.now();if(t-last<55||e.pointerType!=='mouse')return;last=t;const s=document.createElement('span');s.className='trail';s.textContent=Math.random()<.5?'✦':'·';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),900)})}
</script>
